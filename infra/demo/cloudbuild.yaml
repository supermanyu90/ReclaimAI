# Builds the three images on Cloud Build (linux/amd64) and pushes them to Artifact Registry.
substitutions:
  _REPO: asia-south1-docker.pkg.dev/PROJECT/reclaimai
  _TAG: latest
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_REPO}/api:${_TAG}", "."]
    waitFor: ["-"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "workers/Dockerfile", "-t", "${_REPO}/worker:${_TAG}", "."]
    waitFor: ["-"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REPO}/web:${_TAG}", "apps/web"]  # web builds from its own directory
    waitFor: ["-"]
images:
  - ${_REPO}/api:${_TAG}
  - ${_REPO}/worker:${_TAG}
  - ${_REPO}/web:${_TAG}
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
